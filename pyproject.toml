[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-robustness-viewer"
version = "0.1.0"
description = "Time-ordered signal evaluation, purged validation, and an aggregate robustness viewer."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Manan Kothari"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
]

[project.scripts]
signal-robustness = "signal_robustness.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
